modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/astrieke/Minemodreview/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Addon for Strata Core: core drills, epoch gates, the Crystal Age and Spore Age dimensions,
solidification, three mobs (Geode Crawler, Spore Bellows, Petrified Witness), crystal quartz tools,
geode armor and the amber blade.

Addon für Strata Core: Kernbohrer, Epochentore, Kristall- und Sporenzeit, Verfestigung,
drei Mobs, Kristallquarz-Werkzeuge, Geodenrüstung und Bernsteinklinge.
'''

[[dependencies.${mod_id}]]
modId = "strata_core"
type = "required"
versionRange = "${core_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
