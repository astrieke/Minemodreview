modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/astrieke/Minemodreview/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "strata_epochs_logo.png"
logoBlur = false
authors = "${mod_authors}"
description = '''
Addon for Strata Core: drill core samples from the deep, open epoch gates and survive three prehistoric
cave epochs (Crystal Age, Spore Age, Ash Age) before solidification sets in. Fossils, a codex, eight
creatures and the Stratolith boss, epoch crops, time rifts, a museum, crystal quartz tools, geode armor,
and the Transplanter that brings an epoch's landscape to the overworld.

Addon für Strata Core: Bohrkerne aus der Tiefe ziehen, Epochentore öffnen und drei urzeitliche
Höhlen-Epochen (Kristall-, Sporen-, Aschezeit) erkunden, bevor die Verfestigung einsetzt. Fossilien,
Kodex, acht Kreaturen und der Stratolith als Boss, Epochen-Pflanzen, Zeitrisse, Museum, Kristallquarz-
Werkzeuge, Geodenrüstung und der Transplantator, der die Landschaft einer Epoche in die Oberwelt holt.
'''

[[dependencies.${mod_id}]]
modId = "strata_core"
type = "required"
versionRange = "${core_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
