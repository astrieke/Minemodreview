name: Build

on:
  push:
  pull_request:

jobs:
  logic:
    name: Spiellogik (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :common:test

  mod:
    name: Minecraft ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.1", "1.21.11", "26.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle selbst läuft auf 25; 1.21.x wird mit 21 gebaut.
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Bauen
        run: ./gradlew :core-${{ matrix.version }}:build
      - name: Server-Smoke-Test
        run: scripts/smoke-test.sh ${{ matrix.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: strata-core-${{ matrix.version }}
          path: core/versions/${{ matrix.version }}/build/libs/*.jar
