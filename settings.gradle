pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Lädt fehlende JDKs (21 bzw. 25) automatisch herunter.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'strata'

// Reine Spiellogik ohne Minecraft-Abhängigkeit.
include 'common'

// Für jede Minecraft-Version unter versions/<v>/ und jede Mod ein eigenes Gradle-Projekt,
// z. B. :core-1.21.1 oder :epochs-26.3. Die Versionsdaten stehen in versions/<v>/gradle.properties.
def mods = ['core', 'epochs', 'bridge']
file('versions').eachDir { dir ->
    mods.each { mod ->
        def name = "${mod}-${dir.name}"
        def projectDir = file("${mod}/versions/${dir.name}")
        projectDir.mkdirs()
        include name
        project(":${name}").projectDir = projectDir
    }
}
