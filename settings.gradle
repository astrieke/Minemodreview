pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Lädt fehlende JDKs (21 bzw. 25) automatisch herunter.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'strata'

// Reine Spiellogik ohne Minecraft-Abhängigkeit.
include 'common'

// Ein Gradle-Projekt pro unterstützter Minecraft-Version.
// Die Einstellungen stehen jeweils in core/versions/<version>/gradle.properties.
file('core/versions').eachDir { dir ->
    def name = "core-${dir.name}"
    include name
    project(":${name}").projectDir = dir
}
