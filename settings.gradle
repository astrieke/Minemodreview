pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // Lädt fehlende JDKs (21 bzw. 25) automatisch herunter.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'strata'

// Reine Spiellogik ohne Minecraft-Abhängigkeit.
include 'common'

// Jede Mod ist ein eigener Ordner (core/, epochs/, bridge/) mit einem Unterprojekt pro
// Minecraft-Version, z. B. :core:1.21.1 in core/versions/1.21.1. Die Versionsdaten stehen
// in versions/<v>/gradle.properties.
//
// Bauen pro Mod: in den Ordner wechseln und dort gradlew aufrufen, z. B.
//   cd core && ./gradlew build              (alle Versionen, Jars landen in core/build/libs/)
//   cd core && ./gradlew 1.21.1:build       (nur eine Version)
def mods = ['core', 'epochs', 'bridge']
file('versions').eachDir { dir ->
    mods.each { mod ->
        def path = ":${mod}:${dir.name}"
        def projectDir = file("${mod}/versions/${dir.name}")
        projectDir.mkdirs()
        include path
        project(path).projectDir = projectDir
    }
}

// Ein bloßes "runClient" oder "runServer" im Hauptordner (z. B. Doppelklick in IntelliJ) würde sonst
// alle 15 Unterprojekte gleichzeitig starten. Stattdessen startet es einen Client mit allen drei Mods:
// Strata Bridge in der Version aus -Pmc=<version> (Standard 1.21.1).
if (gradle.startParameter.currentDir.canonicalFile == settingsDir.canonicalFile) {
    def mc = gradle.startParameter.projectProperties.get('mc') ?: '1.21.1'
    def names = gradle.startParameter.taskNames
    if (names.any { it in ['runClient', 'runServer'] }) {
        gradle.startParameter.taskNames = names.collect { it in ['runClient', 'runServer'] ? ":bridge:${mc}:${it}".toString() : it }
        println "Starte nur :bridge:${mc} (alle drei Mods). Andere Version: -Pmc=26.3"
    }
}
