modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/astrieke/Minemodreview/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
The core of the Strata modset (Deep Time): codex and progression framework.
Epochs and codex nodes are defined by datapacks; addons build on it.
Addons: Strata Epochs (content), Strata Bridge (integration with JEI, Jade, quest mods).

Kern des Strata-Modsets (Tiefenzeit): Kodex- und Progressions-Framework.
Epochen und Kodex-Knoten kommen per Datapack, Addons bauen darauf auf.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
