plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

// Die Mods des Sets. Jede Mod hat Quellordner unter <mod>/src/<gruppe>/,
// und versions/<v>/gradle.properties legt fest, welche Gruppen eine Version nutzt.
def modInfo = [
        core  : [id: 'strata_core', name: 'Strata Core', jar: 'strata-core-neoforge', deps: []],
        epochs: [id: 'strata_epochs', name: 'Strata Epochs', jar: 'strata-epochs-neoforge', deps: ['core']],
        bridge: [id: 'strata_bridge', name: 'Strata Bridge', jar: 'strata-bridge-neoforge', deps: ['core', 'epochs']],
]
def modIds = modInfo.collectEntries { k, v -> [k, v.id] }

def configureStrataProject = { Project p ->
    // Versionsprojekte heißen :<mod>:<mc-version>, z. B. :core:1.21.1
    def mod = p.parent?.name
    def mcLine = p.name
    def info = modInfo[mod]
    if (info == null) return

    // Versionsdaten laden (MC-, NeoForge- und Java-Version, Quellgruppen).
    def versionProps = new Properties()
    rootProject.file("versions/${mcLine}/gradle.properties").withInputStream { versionProps.load(it) }
    versionProps.each { k, v -> p.ext.set(k as String, v) }

    apply plugin: 'java-library'
    apply plugin: 'net.neoforged.moddev'

    def groups = (versionProps.getProperty("${mod}_src_groups") ?: '').split(',')*.trim().findAll { it }
    if (groups.isEmpty()) throw new GradleException("versions/${mcLine}/gradle.properties: ${mod}_src_groups fehlt")

    version = "${rootProject.property('mod_version')}+${mcLine}"
    // Eigene Gruppe pro Mod: Die Versionsprojekte heißen überall gleich (z. B. 1.21.1),
    // ohne getrennte Gruppen würde Gradle core:1.21.1 und epochs:1.21.1 verwechseln.
    group = "${rootProject.property('mod_group')}.${mod}"
    base.archivesName = info.jar

    java.toolchain.languageVersion = JavaLanguageVersion.of(versionProps.getProperty('java_version') as int)

    sourceSets.main {
        // Die reine Spiellogik wird direkt mitkompiliert, so ist kein Shading nötig.
        if (mod == 'core') java.srcDir rootProject.file('common/src/main/java')
        groups.each { g ->
            java.srcDir rootProject.file("${mod}/src/${g}/java")
            resources.srcDir rootProject.file("${mod}/src/${g}/resources")
        }
    }

    // Abhängigkeiten auf andere Strata-Mods derselben MC-Version.
    def depProjects = info.deps.collect { d -> project(":${d}:${mcLine}") }
    depProjects.each { dp ->
        evaluationDependsOn(dp.path)
        dependencies { implementation dp }
    }

    // Optionale Fremd-Mods (nur Strata Bridge): API zum Kompilieren, volle Mod für Testläufe.
    if (mod == 'bridge') {
        repositories {
            maven { url = 'https://maven.blamejared.com' }
            maven { url = 'https://api.modrinth.com/maven' }
        }
        def jei = versionProps.getProperty('jei_version')
        def jeiLine = versionProps.getProperty('jei_mc')
        def jade = versionProps.getProperty('jade_version')
        dependencies {
            compileOnly "mezz.jei:jei-${jeiLine}-neoforge-api:${jei}"
            runtimeOnly "mezz.jei:jei-${jeiLine}-neoforge:${jei}"
            compileOnly "maven.modrinth:jade:${jade}"
            runtimeOnly "maven.modrinth:jade:${jade}"
        }
    }

    neoForge {
        version = versionProps.getProperty('neo_version')
        runs {
            server {
                server()
                gameDirectory = p.file('run/server')
                programArgument '--nogui'
                // Schaltet beim Serverstart zusätzliche Selbsttests ein (nur in Entwicklungsläufen).
                systemProperty 'strata.selftest', 'true'
            }
            client {
                client()
                gameDirectory = p.file('run/client')
                // Direkt in eine Welt springen: ./gradlew :epochs:1.21.1:runClient -PquickPlay=<Weltordner>
                if (rootProject.hasProperty('quickPlay')) {
                    programArguments.addAll('--quickPlaySingleplayer', rootProject.property('quickPlay') as String)
                }
            }
        }
        mods {
            "${info.id}" { sourceSet sourceSets.main }
            depProjects.eachWithIndex { dp, i ->
                "${modIds[info.deps[i]]}" { sourceSet dp.sourceSets.main }
            }
        }
    }

    def props = [
            mod_id                 : info.id,
            mod_name               : info.name,
            mod_version            : p.version,
            mod_license            : rootProject.property('mod_license'),
            mod_authors            : rootProject.property('mod_authors'),
            minecraft_version      : versionProps.getProperty('minecraft_version'),
            minecraft_version_range: versionProps.getProperty('minecraft_version_range'),
            neo_version            : versionProps.getProperty('neo_version'),
            core_version_range     : "[${rootProject.property('mod_version')},)",
            strata_version_range   : "[${rootProject.property('mod_version')},)",
            jei_version            : versionProps.getProperty('jei_version') ?: '',
            jade_version           : versionProps.getProperty('jade_version') ?: '',
    ]
    tasks.named('processResources') {
        inputs.properties props
        filesMatching(['META-INF/neoforge.mods.toml', '*_build.properties']) { expand props }
    }

    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

    if (mod == 'epochs') apply from: rootProject.file('epochs/worldgen.gradle')
    if (mod == 'bridge') apply from: rootProject.file('bridge/generated.gradle')
}

// In Abhängigkeitsreihenfolge konfigurieren (core vor epochs vor bridge), nicht alphabetisch.
modInfo.keySet().each { m ->
    project(":${m}").subprojects.each { sp -> configure(sp, configureStrataProject) }
}

// Jede Mod (core, epochs, bridge) sammelt die Jars aller Versionen in <mod>/build/libs/.
// `cd core && ./gradlew build` baut also alle Core-Versionen und legt die Jars dort ab.
modInfo.keySet().each { m ->
    project(":${m}") { modProject ->
        def collect = tasks.register('collectJars', Copy) {
            group = 'build'
            description = "Sammelt die Jars aller Minecraft-Versionen von ${m} in ${m}/build/libs/"
            modProject.subprojects.each { sp ->
                from(sp.tasks.named('jar'))
            }
            into modProject.layout.buildDirectory.dir('libs')
        }
        tasks.register('build') {
            group = 'build'
            description = "Baut ${m} für alle Minecraft-Versionen"
            dependsOn modProject.subprojects.collect { it.tasks.named('build') }
            dependsOn collect
        }
        tasks.register('clean', Delete) {
            group = 'build'
            delete modProject.layout.buildDirectory
            dependsOn modProject.subprojects.collect { it.tasks.named('clean') }
        }
    }
}
