modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/astrieke/Minemodreview/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Addon for Strata Core and Strata Epochs: connects Strata with other mods. JEI and EMI info pages,
Jade tooltips, a Curios charm slot for the Time Anchor, KubeJS bindings and an advancement for
every codex node (for FTB Quests, Heracles & co.). All other mods are optional.

Addon für Strata Core und Strata Epochs: JEI- und EMI-Infoseiten, Jade-Tooltips, Curios-Slot für
den Zeitanker, KubeJS-Bindings und Advancements für jeden Kodex-Knoten. Alle Fremd-Mods sind optional.
'''

[[dependencies.${mod_id}]]
modId = "strata_core"
type = "required"
versionRange = "${strata_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "strata_epochs"
type = "required"
versionRange = "${strata_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
